<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RARS Console</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0a0a0a; color: #4ade80;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #161616;
    border-bottom: 1px solid #2a2a2a; color: #aaa; font-family: system-ui, sans-serif; }
  header button { background: #2a2a2a; color: #ddd; border: 0; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  header span { flex: 1; text-align: right; }
  #console { flex: 1; margin: 0; padding: 12px; overflow-y: auto; white-space: pre-wrap; outline: 0; }
  body.drag #console { outline: 2px dashed #60a5fa; outline-offset: -8px; }
</style>
</head>
<body>
<header>
  <button id="pick">Open .s file</button>
  <button id="rerun">Re-run</button>
  <span id="status">Loading Java runtime…</span>
  <input type="file" id="file" accept=".s,.asm,.S,.txt" hidden>
</header>
<pre id="console"></pre>

<script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
<script>
const $ = id => document.getElementById(id);
let lastFile = null;
let running = false;

const ready = cheerpjInit();
ready.then(() => { $('status').textContent = 'Drop a .s file anywhere'; });

async function run(file) {
  if (!file) return;
  if (running) { location.reload(); return; }   // one run per page load is the safe path
  running = true;
  lastFile = file;
  await ready;
  const text = await file.text();
  const name = file.name.replace(/[^\w.-]/g, '_');
  cheerpOSAddStringFile('/str/' + name, text);
  $('status').textContent = name;
  $('console').textContent = '';
  const code = await cheerpjRunJar('/app/rars1_6.jar', 'nc', '/str/' + name);
  $('console').append(`\n[exit: ${code}]\n`);
  running = false;
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => { run(e.target.files[0]); e.target.value = ''; };
$('rerun').onclick = () => lastFile && location.reload();

addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('drag');
  run(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
